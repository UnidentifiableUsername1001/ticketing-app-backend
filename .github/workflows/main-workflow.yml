name: Test and lint
run-name: Pull request / push to ${{ github.base_ref }} by ${{ github.actor }}
permissions: 
  contents: read
  packages: write
on: 
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
        branches: [main]

jobs:
    lint:
        name: Run Linters
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v7

          - name: Setup Node.js
            uses: actions/setup-node@v7
            with: 
                node-version: '24'
                cache: 'npm'
            
          - name: Install dependencies
            run: npm ci

          - name: Run ESLint
            run: npx eslint . --ext .js,.jsx
    
    docker:
      needs: lint
      if: ${{ github.ref == 'refs/heads/main' }} 
      runs-on: ubuntu-latest
      outputs:
        container-tag: ${{ steps.meta.outputs.tag }}
      steps:

        - name: Checkout code
          uses: actions/checkout@v7

        - name: Docker meta
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: |
              ghcr.io/unidentifiableusername1001/ticketing-app-backend
            tags: |
              type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
              type=ref,event=branch
              type=sha

        - name: Login to GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
            
        -
          name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        -
          name: Build and push
          uses: docker/build-push-action@v7
          with:
            push: true
            tags: ${{ steps.meta.outputs.tags }}
    deploy:
      needs: docker
      if: ${{ github.ref == 'refs/heads/main' }}
      runs-on: ubuntu-latest
      steps:
        -
          name: SSH into EC2 and deploy
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              echo "${{ secrets.PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
              cd ticketing-app
              docker compose pull backend
              docker compose up -d --force-recreate backend