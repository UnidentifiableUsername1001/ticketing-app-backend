name: Test and lint
run-name: Pull request / push to ${{ github.base_ref }} by ${{ github.actor }}
on: 
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
        branches: [main]

jobs:
    lint:
        name: Run Linters
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v7

          - name: Setup Node.js
            uses: actions/setup-node@v7
            with: 
                node-version: '24'
                cache: 'npm'
            
          - name: Install dependencies
            run: npm ci

          - name: Run ESLint
            run: npx eslint . --ext .js,.jsx
            
                
        